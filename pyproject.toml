[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-alert-monitor"
version = "1.0.0"
description = "Real-time API alert monitor that posts to Discord"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
discord-alert-monitor = "alertmonitor.main:cli"

[tool.setuptools.packages.find]
include = ["alertmonitor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
